# Generado por /init (ai-dd). Valida el flujo y la seguridad en cada PR.
# Modo baseline: los pasos de seguridad solo fallan por problemas NUEVOS del PR, para que la deuda
# previa (registrada en docs/security.md) no bloquee todos los PRs. Un job semanal revisa el repo
# completo y reporta sin bloquear.
# Fija cada acción a un SHA de commit completo y cada imagen a una versión (cadena de suministro).
name: ai-dd

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # revisión completa semanal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flujo:
    name: Artefactos del flujo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # TODO: fijar a SHA
      - uses: actions/setup-python@v5   # TODO: fijar a SHA
        with:
          python-version: "3.12"
      - name: Validar specs, planes y tareas
        run: python .ai/bin/aidd.py validate

  calidad:
    name: Tests y lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # TODO: fijar a SHA
      # {{pasos de setup del runtime del proyecto; omitir el job si otro workflow ya corre los tests}}
      - run: {{install}}
      - run: {{lint}}   # en brownfield, limitarlo a los archivos cambiados del PR
      - run: {{test}}
      - run: {{build}}

  seguridad-pr:
    name: Seguridad (solo cambios del PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # TODO: fijar a SHA
        with:
          fetch-depth: 0
      - name: Secretos en los commits del PR
        # ejemplo: gitleaks git --log-opts="origin/${{ github.base_ref }}..HEAD" --no-banner
        run: {{secrets_pr}}
      - name: SAST, solo hallazgos nuevos
        # ejemplo: semgrep scan --config p/php --baseline-commit "$(git merge-base origin/${{ github.base_ref }} HEAD)" --error
        run: {{sast_pr}}
      - name: Dependencias, solo si el PR cambia lockfiles
        # sustituye LOCKFILES por la expresión de los lockfiles del proyecto, p. ej. '(composer\.lock|package-lock\.json)$'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE 'LOCKFILES'; then
            {{security.tools.sca}}
          else
            echo "El PR no cambia dependencias"
          fi

  seguridad-completa:
    name: Seguridad (repo completo, informativo)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true   # reporta la deuda sin bloquear; cada hallazgo alto va a docs/security.md
    steps:
      - uses: actions/checkout@v4   # TODO: fijar a SHA
        with:
          fetch-depth: 0
      - run: {{security.tools.secrets}}
      - run: {{security.tools.sast}}
      - run: {{security.tools.sca}}
      - run: {{security.tools.containers}}
