# Generado por /init. Lo leen todas las skills del flujo.
name: {{project_name}}
type: {{type}}                 # frontend | backend | fullstack | mobile | monorepo | library
stage: {{stage}}               # prototype | mvp | production | maintenance
origin: {{origin}}             # greenfield | brownfield
language: {{language}}         # es | en | … idioma de los documentos (shared/vocabulary.md)
initialized_at: {{date}}
stack:
  languages: [{{languages}}]
  frontend: {{frontend_stack}} # null si no aplica
  backend: {{backend_stack}}   # null si no aplica
  database: {{database}}
  package_manager: {{package_manager}}
packages: []                   # solo monorepo: [{ path: apps/web, type: frontend }, …]
constitution_version: 1.0.0
workflow:
  enforcement: warn            # off | warn (pide aprobación) | block — lo aplica el hook del plugin
skills_version: {{skills_version}}   # versión del paquete de skills con que se inicializó
deploy:
  strategy: {{strategy}}       # none | manual | ci-on-merge | ci-on-tag
  platform: {{platform}}
  environments: [{{environments}}]   # p. ej. [dev, staging, prod]
  prod_approval: human         # innegociable
  rollback: {{rollback}}       # descripción corta o TODO(init)
security:
  owasp_top10_edition: {{año}}
  asvs_level: {{1|2|3}}
  sensitive_data: [{{personal, financial, health, credentials}}]
  tools:                       # comandos; vacío si no hay herramienta configurada
    secrets: {{gitleaks detect --no-banner}}
    sast: {{semgrep scan --config auto --error}}
    sca: {{npm audit --audit-level=high}}
    containers: {{trivy fs --severity HIGH,CRITICAL .}}
    dast: {{null}}             # solo contra staging
  agent:
    min_package_age_days: 7
    protected_paths: []        # además de las de shared/agent-security.md
observability:
  log_level_prod: {{info}}
  correlation_header: {{X-Request-Id}}
  audit:
    required: {{true|false}}
    events: [{{login, login_failed, access_denied, sensitive_read, sensitive_write, role_change}}]
    retention: {{TODO(init)}}
skills:
  enabled: [{{enabled_skills}}]  # p. ej. [design]
paths:
  constitution: docs/constitution.md
  architecture: docs/architecture.md
  roadmap: docs/roadmap.md
  deployment: docs/deployment.md
  security: docs/security.md
  observability: docs/observability.md
  changelog: CHANGELOG.md
  specs: docs/specs
  adr: docs/adr
  templates: docs/templates
verification:                  # lo llena la Fase 4
  - { command: "{{cmd}}", result: pass|fail, note: "" }
