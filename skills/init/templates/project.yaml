# Generado por /init. Lo leen todas las skills del flujo.
name: {{project_name}}
type: {{type}}                 # frontend | backend | fullstack | mobile | monorepo | library
stage: {{stage}}               # prototype | mvp | production | maintenance
origin: {{origin}}             # greenfield | brownfield
language: {{language}}         # es | en | … idioma de los documentos (shared/vocabulary.md)
initialized_at: {{date}}
stack:
  languages: [{{languages}}]
  frontend: {{frontend_stack}} # null si no aplica
  backend: {{backend_stack}}   # null si no aplica
  database: {{database}}
  package_manager: {{package_manager}}
packages: []                   # solo monorepo: [{ path: apps/web, type: frontend }, …]
constitution_version: 1.0.0
workflow:
  enforcement: warn            # off | warn (pide aprobación) | block — lo aplica el hook del plugin
skills_version: {{skills_version}}   # versión del paquete de skills con que se inicializó
deploy:
  strategy: {{strategy}}       # none | manual | ci-on-merge | ci-on-tag
  platform: {{platform}}
  environments: [{{environments}}]   # p. ej. [dev, staging, prod]
  prod_approval: human         # innegociable
  rollback: {{rollback}}       # descripción corta o TODO(init)
security:
  owasp_top10_edition: {{año}}
  asvs_level: {{1|2|3}}            # backend propio; null si no hay
  masvs_level: {{L1|L2|R|null}}    # solo mobile
  sensitive_data: [{{personal, financial, health, credentials}}]
  tools:                       # status: propuesta | instalada | en-ci | no-aplica. Solo se ejecutan
                               # instalada y en-ci; una propuesta es un pendiente, no un control;
                               # no-aplica lleva su motivo en docs/security.md (p. ej. sin contenedores).
    secrets: { command: "{{gitleaks detect --no-banner}}", status: {{propuesta}} }
    sast: { command: "{{semgrep scan --config p/<ruleset> --metrics=off --error}}", status: {{propuesta}} }
    sca: { command: "{{npm audit --audit-level=high}}", status: {{propuesta}} }
    containers: { command: {{null}}, status: {{propuesta}} }
    dast: { command: {{null}}, status: {{propuesta}} }   # solo contra staging
  agent:
    min_package_age_days: 7
    protected_paths: []        # además de las de shared/agent-security.md
observability:
  log_level_prod: {{info}}
  correlation_header: {{X-Request-Id}}
  audit:
    required: {{true|false}}
    events: [{{login, login_failed, access_denied, sensitive_read, sensitive_write, role_change}}]
    retention: {{TODO(init)}}
design:                        # solo proyectos con interfaz (frontend, fullstack, mobile)
  status: {{none|declined|draft|approved}}   # declined: el usuario no quiso documentarlo (no se vuelve a preguntar)
  source: {{chosen|extracted|null}}         # chosen: elegido entre opciones · extracted: documentado del código
  system: docs/design/system.md
  html: docs/design/system.html
  canvas: {{null}}             # enlace del canvas si se usó la skill design
  widths: [{{390, 1440}}]      # anchos de comprobación (mobile: [360, 412])
skills:
  enabled: [{{enabled_skills}}]  # p. ej. [design] (plugin oficial de Anthropic, si está instalado)
paths:
  constitution: docs/constitution.md
  architecture: docs/architecture.md
  roadmap: docs/roadmap.md
  deployment: docs/deployment.md
  security: docs/security.md
  observability: docs/observability.md
  changelog: CHANGELOG.md
  specs: docs/specs
  adr: docs/adr
  templates: docs/templates
template_hashes: {}            # huellas de docs/templates/ (aidd.py templates --yaml); las usa --upgrade
verification:                  # lo llena la Fase 4
  - { command: "{{cmd}}", result: pass|fail, note: "" }
